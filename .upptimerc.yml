owner: ip-db
repo: status

sites:
  - name: Website
    url: https://ip-db.com/en/
  - name: IP Lookup API
    url: https://api.ip-db.com/v1/check/8.8.8.8
    expectedStatusCodes:
      - 401
  - name: Statistics API
    url: https://ip-db.com/stats/lookups.json
  - name: WHOIS Lookup
    url: https://whois.ip-db.com/en/
  - name: API Documentation
    url: https://ip-db.com/en/api-docs

status-website:
  cname: status.ip-db.com
  logoUrl: https://status.ip-db.com/logo.png
  favicon: https://status.ip-db.com/favicon.png
  name: ip-db.com Status
  introTitle: "**IP-DB** service status"
  introMessage: Availability and response times of ip-db.com services, checked every five minutes from outside our infrastructure.
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <style>
    html:root{--ip-bg:#f6f8fb;--ip-surface:#ffffff;--ip-border:#e2e8f0;--ip-text:#0f172a;--ip-muted:#64748b;--ip-accent:#2563eb;--ip-up:#16a34a;--ip-deg:#d97706;--ip-down:#dc2626;--ip-down-soft:#fef2f2;--ip-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05);--ip-nav:rgba(255,255,255,.86)}
    @media (prefers-color-scheme:dark){html:root{--ip-bg:#070b13;--ip-surface:#10182a;--ip-border:rgba(255,255,255,.08);--ip-text:#e2e8f0;--ip-muted:#94a3b8;--ip-accent:#60a5fa;--ip-up:#22c55e;--ip-deg:#f59e0b;--ip-down:#f87171;--ip-down-soft:rgba(248,113,113,.10);--ip-shadow:0 1px 2px rgba(0,0,0,.35);--ip-nav:rgba(16,24,42,.86)}}
    html:root{--body-background-color:var(--ip-bg);--body-text-color:var(--ip-text);--card-background-color:var(--ip-surface);--nav-background-color:var(--ip-nav);--nav-border-bottom-color:var(--ip-border);--nav-current-border-bottom-color:var(--ip-accent);--card-border-color:var(--ip-border);--down-border-left-color:var(--ip-down);--down-background-color:var(--ip-down-soft);--degraded-border-left-color:var(--ip-deg);--up-border-left-color:var(--ip-up);--tag-color:#ffffff;--tag-up-background-color:var(--ip-up);--tag-down-background-color:var(--ip-down);--tag-degraded-background-color:var(--ip-deg);--change-background-color:var(--ip-deg);--error-button-border-color:var(--ip-accent);--error-button-background-color:var(--ip-accent);--error-button-color:#ffffff;--submit-button-border-color:var(--ip-accent);--submit-button-background-color:var(--ip-accent);--submit-button-color:#ffffff}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:0}
    .container{max-width:960px}
    nav{position:sticky;top:0;z-index:20;font-weight:500 !important;margin-bottom:2.75rem !important;-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
    nav a{padding:1.15rem 1rem !important;font-size:14px;color:var(--ip-muted)}
    nav a:hover,nav a[aria-current]{color:var(--ip-text)}
    nav .logo{padding:.8rem 0 !important;margin-right:1.5rem !important;font-size:16px;font-weight:700 !important;letter-spacing:-.01em;color:var(--ip-text) !important}
    nav .logo img{width:32px;height:32px !important;margin-right:.65rem !important;border-radius:0 !important}
    main header h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-bottom:.4em}
    main header .lead{color:var(--ip-muted);font-size:16px;max-width:640px}
    h2{font-size:18px;font-weight:650;letter-spacing:-.01em}
    h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ip-muted);opacity:1}
    h4{font-weight:600}
    article{border-radius:12px !important;box-shadow:var(--ip-shadow);padding:1.1rem 1.35rem !important}
    article.up,article.down,article.degraded{border-left-width:3px !important}
    article + article{margin-top:.65rem !important}
    article a{color:inherit}
    .tag{border-radius:999px !important;font-size:12px !important;font-weight:600;padding:.25rem .65rem !important;letter-spacing:.01em}
    main a{color:var(--ip-accent)}
    main article a,main h4 a{color:inherit}
    a.error-button{border-radius:10px !important}
    .loading svg{stroke:var(--ip-muted)}
    footer{margin-top:3.5rem;padding:1.6rem 0 2rem;border-top:1px solid var(--ip-border);color:var(--ip-muted);font-size:13px;text-align:center}
    footer a{color:var(--ip-text);text-decoration:none;font-weight:500}
    footer a:hover{text-decoration:underline}
    </style>
  navbar:
    - title: Status
      href: /
    - title: ip-db.com
      href: https://ip-db.com
    - title: API
      href: https://ip-db.com/en/api-docs
    - title: Contact
      href: https://ip-db.com/en/contact

i18n:
  footer: "Copyright 2026 IP-DB. All rights reserved. [ip-db.com](https://ip-db.com)"
  errorIntro: "Status details could not be loaded right now."
  errorText: "Please try again in a few moments."
  errorHome: "Reload status page"

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

commitMessages:
  readmeContent: "Update summary in README [skip ci] [upptime]"
  summaryJson: "Update status summary [skip ci] [upptime]"
  statusChange: "$SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: "Update graphs [skip ci] [upptime]"
  commitAuthorName: "IP-DB"
  commitAuthorEmail: "358008270+ip-db@users.noreply.github.com"

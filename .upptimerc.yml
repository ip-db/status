owner: ip-db
repo: status

sites:
  - name: Website
    url: https://ip-db.com/en/
  - name: IP Lookup API
    url: https://ip-db.com/api/v1/check/8.8.8.8
    expectedStatusCodes:
      - 401
  - name: Statistics API
    url: https://ip-db.com/stats/lookups.json
  - name: WHOIS Lookup
    url: https://whois.ip-db.com/en/
  - name: API Documentation
    url: https://ip-db.com/en/api-docs

status-website:
  cname: status.ip-db.com
  logoUrl: https://ip-db.com/static/img/favicon.svg
  favicon: https://ip-db.com/static/img/favicon-32.png
  name: IP-DB Status
  introTitle: "**IP-DB** service status"
  introMessage: Availability and response times of ip-db.com services, checked every five minutes from outside our infrastructure.
  navbar:
    - title: Status
      href: /
    - title: ip-db.com
      href: https://ip-db.com
    - title: API
      href: https://ip-db.com/en/api-docs
    - title: Contact
      href: https://ip-db.com/en/contact

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

commitMessages:
  readmeContent: "Update summary in README [skip ci] [upptime]"
  summaryJson: "Update status summary [skip ci] [upptime]"
  statusChange: "$SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms) [skip ci] [upptime]"
  graphsUpdate: "Update graphs [skip ci] [upptime]"
  commitAuthorName: "IP-DB"
  commitAuthorEmail: "358008270+ip-db@users.noreply.github.com"
